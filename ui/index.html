<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>火灵连接器</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="./icon.svg" alt="" aria-hidden="true" />
        <div>
          <strong>火灵连接器</strong>
          <span id="connection-label">未连接</span>
        </div>
      </div>
      <div id="notice-carousel" class="notice-carousel" role="region" aria-live="polite" aria-label="服务通知" hidden>
        <button id="notice-previous" class="notice-nav-button" type="button" aria-label="上一条通知">‹</button>
        <button id="notice-trigger" class="notice-trigger" type="button">
          <span id="notice-level" class="notice-level" aria-hidden="true"></span>
          <span id="notice-title" class="notice-title"></span>
          <span id="notice-count" class="notice-count"></span>
        </button>
        <button id="notice-next" class="notice-nav-button" type="button" aria-label="下一条通知">›</button>
      </div>
      <nav class="primary-nav" aria-label="主菜单">
        <button class="nav-item active" type="button" data-view="home">主页</button>
        <button class="nav-item" type="button" data-view="recharge">充值与兑换</button>
      </nav>
      <div class="top-actions">
        <span id="development-badge" class="development-badge" hidden>开发模式</span>
        <button id="refresh-button" class="icon-button" type="button" title="刷新数据" hidden>↻</button>
        <button id="disconnect-button" class="quiet-button" type="button" hidden>移除配置</button>
      </div>
    </header>

    <main class="shell">
      <section id="home-view">
      <section id="setup-view" class="setup-layout">
        <div class="setup-panel">
          <div class="section-heading">
            <span class="section-icon" aria-hidden="true">⌁</span>
            <div>
              <h1>连接服务</h1>
              <p id="setup-description">填写服务地址、用户 ID 和系统访问令牌，客户端会自动获取 API Key。</p>
            </div>
          </div>
          <form id="connect-form" class="form-grid">
            <label>
              <span>API Base URL</span>
              <input id="base-url" type="url" inputmode="url" placeholder="https://api.example.com" required />
            </label>
            <label>
              <span>API Key（自动获取）</span>
              <input id="api-key" type="hidden" autocomplete="off" />
              <small class="muted">连接后自动获取，不需要手动填写。</small>
            </label>
            <label>
              <span>用户 ID（可选）</span>
              <input id="user-id" type="number" min="1" inputmode="numeric" placeholder="预创建账户填写" required />
            </label>
            <label>
              <span>系统访问令牌（可选）</span>
              <input id="access-token" type="password" autocomplete="off" spellcheck="false" placeholder="与用户 ID 配套" required />
            </label>
            <button id="connect-button" class="primary-button" type="submit">连接并获取配置</button>
          </form>
        </div>

      </section>

      <section id="dashboard-view" hidden>
        <div class="connection-strip">
          <div>
            <span class="label">当前连接</span>
            <strong id="dashboard-key">-</strong>
            <span id="dashboard-user" class="muted">用户 ID 未提供</span>
          </div>
          <code id="dashboard-base-url">-</code>
          <span id="refresh-time" class="muted">-</span>
        </div>

        <div class="metrics" aria-label="用量概览">
          <article class="metric accent">
            <span>剩余积分</span>
            <strong id="remaining-points">-</strong>
          </article>
          <article class="metric">
            <span>累计已用</span>
            <strong id="used-points">-</strong>
          </article>
          <article class="metric">
            <span>总请求数</span>
            <strong id="total-requests">-</strong>
          </article>
          <article class="metric">
            <span>近 24 小时请求</span>
            <strong id="last24-requests">-</strong>
          </article>
        </div>

        <section class="data-section">
          <div class="section-title-row">
            <div>
              <h2>可用模型</h2>
              <span id="model-count" class="muted">0 个模型</span>
            </div>
            <span id="model-warning" class="inline-warning" hidden></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>模型</th>
                  <th>状态</th>
                  <th>连通测试</th>
                </tr>
              </thead>
              <tbody id="model-rows"></tbody>
            </table>
          </div>
        </section>

        <section class="workbuddy-section">
          <div>
            <span class="eyebrow">WORKBUDDY</span>
            <h2>写入本地模型配置</h2>
            <code id="workbuddy-path">~/.workbuddy/models.json</code>
          </div>
          <div class="workbuddy-actions">
            <button id="workbuddy-button" class="primary-button" type="button">导入 WorkBuddy</button>
            <span id="workbuddy-result" class="muted"></span>
          </div>
        </section>
      </section>
      </section>

      <section id="recharge-view" class="recharge-layout" hidden>
        <div class="page-heading">
          <div>
            <span class="eyebrow">ACCOUNT</span>
            <h1>充值与兑换</h1>
            <p>管理 API Key 和调用额度。</p>
          </div>
        </div>

        <div id="recharge-grid" class="recharge-grid">
          <section class="setup-panel action-panel">
            <div class="section-heading">
              <span class="section-icon" aria-hidden="true">⌁</span>
              <div>
                <h2>兑换额度</h2>
                <p>输入云猫购买的普通兑换码，使用系统令牌给当前账户增加额度。</p>
              </div>
            </div>
            <form id="redeem-form" class="form-grid">
              <label>
                <span>兑换码</span>
                <input id="redeem-code" type="text" autocomplete="off" spellcheck="false" placeholder="请输入兑换码" required />
              </label>
              <button id="redeem-button" class="primary-button" type="submit">兑换并刷新额度</button>
            </form>
            <p id="redeem-result" class="action-result" role="status"></p>
          </section>

          <section id="promotion-panel" class="setup-panel action-panel" hidden>
            <div class="section-heading">
              <span class="section-icon alternate" aria-hidden="true">↗</span>
              <div>
                <h2 id="promotion-title">官方购买</h2>
                <p id="promotion-description"></p>
              </div>
            </div>
            <div class="form-grid">
              <button id="purchase-button" class="primary-button" type="button" disabled>前往购买</button>
            </div>
            <p id="purchase-result" class="action-result" role="status"></p>
          </section>
        </div>
      </section>

      <div id="message" class="message" role="status" hidden></div>
    </main>

    <dialog id="notice-dialog" class="notice-dialog" aria-labelledby="notice-dialog-title">
      <div class="notice-dialog-header">
        <span id="notice-dialog-level" class="notice-dialog-level">服务通知</span>
        <form method="dialog">
          <button class="notice-dialog-close" type="submit" aria-label="关闭通知">×</button>
        </form>
      </div>
      <h2 id="notice-dialog-title"></h2>
      <p id="notice-dialog-content"></p>
      <button id="notice-dialog-link" class="primary-button notice-dialog-link" type="button" hidden>查看详情</button>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
