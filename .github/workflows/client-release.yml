name: Build Desktop Client

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            runner: ubuntu-22.04
            bundle: appimage
            artifact: huoling-connector-linux-amd64
            release_file: Huoling-Connector-linux-amd64.AppImage
          - name: Windows NSIS
            runner: windows-latest
            bundle: nsis
            artifact: huoling-connector-windows-x64
            release_file: Huoling-Connector-windows-x64-setup.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build client
        working-directory: src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - name: Normalize Linux artifact name
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          mkdir -p release-artifacts
          cp target/release/bundle/appimage/*.AppImage "release-artifacts/${{ matrix.release_file }}"

      - name: Normalize Windows artifact name
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $source = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS installer was not generated" }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          Copy-Item $source.FullName "release-artifacts/${{ matrix.release_file }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/release-artifacts/${{ matrix.release_file }}
          if-no-files-found: error

  publish-release:
    name: Attach clients to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-client
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: huoling-connector-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
