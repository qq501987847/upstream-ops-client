[package]
name = "upstreamops-workbuddy"
version = "0.1.0"
description = "UpstreamOps local client for WorkBuddy"
edition = "2021"

[lib]
name = "upstreamops_workbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
